[project]
name = "projectpulse-rag"
version = "0.1.0"
description = "AI-Driven Technical Project Coordinator & Production RAG System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.30.0",
    "pydantic>=2.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.2",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "pypdf>=3.10.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "inngest>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
